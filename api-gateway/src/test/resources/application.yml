# Test-only overrides so the suite is hermetic - it must not depend on config-server or
# discovery-server actually running. The route below replaces config-repo/api-gateway.yml's
# real routes with a single one pointed at a guaranteed-unreachable address, so tests can
# exercise the CircuitBreaker -> fallback path deterministically without a real downstream
# service (or WireMock) to fail against.
spring:
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: test-service
          uri: http://localhost:1
          predicates:
            - Path=/api/test/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: testServiceCB
                fallbackUri: forward:/fallback/test-service

resilience4j:
  circuitbreaker:
    instances:
      testServiceCB:
        slidingWindowSize: 4
        minimumNumberOfCalls: 2
  timelimiter:
    instances:
      testServiceCB:
        timeoutDuration: 2s

eureka:
  client:
    enabled: false
