spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:config-client}
      password: ${CONFIG_SERVER_PASSWORD:config-client-secret}

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info
