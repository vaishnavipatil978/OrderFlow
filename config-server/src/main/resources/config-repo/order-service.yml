server:
  port: 8084

# Redis (roadmap item 14) isn't running/wired yet, so its actuator health indicator would
# otherwise report DOWN even though the service itself is healthy. Remove once that phase
# lands and Redis is actually reachable. (Eureka's equivalent override was removed now that
# discovery-server, roadmap item 5, is live.)
management:
  health:
    redis:
      enabled: false

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderflow_order}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:orderflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

# How often the outbox relay polls for unpublished order events.
orderflow:
  outbox:
    poll-interval-ms: 1000
