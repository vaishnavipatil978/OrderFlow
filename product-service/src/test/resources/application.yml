# Test-only overrides so the suite is hermetic - it must not depend on config-server or
# discovery-server actually running. spring.datasource.* is deliberately absent here: the
# Testcontainers Postgres container's JDBC URL isn't known until the container has actually
# started, so AbstractIntegrationTest registers it dynamically via @DynamicPropertySource.
# orderflow.jwt.secret matches identity-service's own test secret so a token minted by either
# suite's JwtService would validate against the other - proving the two services genuinely
# share one verification contract instead of coincidentally similar ones.
spring:
  cloud:
    config:
      enabled: false
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

eureka:
  client:
    enabled: false

orderflow:
  jwt:
    secret: ZwxARLiyNc9Of8a4WsDzxQxaFYNhGHQf9SAsYSlX1Ik=
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: orderflow-identity-service-test
